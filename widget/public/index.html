<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IWP Chatbot Widget</title>
</head>
<body style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fef7ed;color:#1f2937">
  <main style="max-width:720px;margin:0 auto;padding:64px 24px">
    <h1 style="margin:0 0 12px">IWP Chatbot Widget</h1>
    <p style="margin:0 0 24px;line-height:1.6">
      The chat widget is loaded in the bottom-right corner. Click the button to start
      planning your wedding.
    </p>
    <p style="margin:0;line-height:1.6;font-size:14px;color:#6b7280">
      Embed this widget on any site by including
      <code>&lt;script src="/iwp-chatbot.iife.js"&gt;&lt;/script&gt;</code>.
    </p>
  </main>
  <script>
    (function () {
      function getApiUrl() {
        var host = window.location.hostname;
        if (host === 'localhost' || host === '127.0.0.1' || host === '') {
          return 'http://localhost:8000/api/v1';
        }
        return 'https://iwp-chatbot.onrender.com/api/v1';
      }

      function getBasePath() {
        var path = window.location.pathname;
        if (!path.endsWith('/')) {
          var lastPart = path.slice(path.lastIndexOf('/') + 1);
          if (lastPart.indexOf('.') === -1) {
            path += '/';
          }
        }
        return path;
      }

      function start() {
        if (!window.IWPChatbot) {
          setTimeout(start, 100);
          return;
        }
        var widget = new window.IWPChatbot({
          apiUrl: getApiUrl(),
          position: 'bottom-right'
        });
        widget.init();
      }

      var script = document.createElement('script');
      script.src = getBasePath() + 'iwp-chatbot.iife.js';
      script.onload = start;
      script.onerror = function () {
        console.error('Failed to load IWP Chatbot widget bundle');
      };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
