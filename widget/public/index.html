<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IWP Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="margin:0;padding:40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fef7ed;min-height:100vh">
  <h1>Indian Wedding Planners</h1>
  <p>Chatbot widget should appear in bottom-right corner</p>
  <script src="iwp-chatbot.iife.js"></script>
  <script>
    (function() {
      function init() {
        if (typeof window.IWPChatbot === 'undefined') {
          return setTimeout(init, 200);
        }
        var w = new window.IWPChatbot({
          apiUrl: 'https://iwp-chatbot-backend.onrender.com/api/v1',
          position: 'bottom-right'
        });
        w.init();
      }
      init();
    })();
  </script>
</body>
</html>
