<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IWP Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="font-family:sans-serif;padding:40px;background:#fef7ed">
  <h1>Indian Wedding Planners</h1>
  <p>Chatbot widget test page</p>
  <script src="iwp-chatbot.iife.js"></script>
  <script>
    window.addEventListener('load', function() {
      if (window.IWPChatbot) {
        var widget = new window.IWPChatbot({
          apiUrl: 'https://iwp-chatbot-backend.onrender.com/api/v1',
          position: 'bottom-right'
        });
        widget.init();
      }
    });
  </script>
</body>
</html>
