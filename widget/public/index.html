<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IWP Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="font-family:sans-serif;padding:40px;background:#fef7ed">
  <h1>Indian Wedding Planners</h1>
  <p>Chatbot widget</p>
  <script src="iwp-chatbot.iife.js"></script>
  <script>
    (function(){
      function ready(fn){
        if(document.readyState!='loading') fn();
        else document.addEventListener('DOMContentLoaded',fn);
      }
      ready(function(){
        setTimeout(function(){
          try{
            var C = window.IWPChatbot || (typeof IWPChatbot!=='undefined'?IWPChatbot:null);
            if(C){
              var w = new C({apiUrl:'https://iwp-chatbot-backend.onrender.com/api/v1',position:'bottom-right'});
              w.init();
            }
          }catch(e){console.log(e)}
        }, 50);
      });
    })();
  </script>
</body>
</html>
