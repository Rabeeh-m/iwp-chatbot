<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IWP Chatbot</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body style="margin:0;padding:20px;font-family:sans-serif;background:#fef7ed;min-height:100vh;">
  <h1>Indian Wedding Planners</h1>
  <p>Chatbot should appear in bottom-right corner</p>
  <script src="./iwp-chatbot.iife.js"></script>
  <script>
    (function(){
      try {
        var w = new window.IWPChatbot({apiUrl:'https://iwp-chatbot-backend.onrender.com/api/v1', position:'bottom-right'});
        w.init();
        console.log('Widget initialized');
      } catch(e) {
        console.error(e);
      }
    })();
  </script>
</body>
</html>
