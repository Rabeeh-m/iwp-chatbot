<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IWP Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 style="padding:40px;font-family:sans-serif;">Indian Wedding Planners</h1>
  <script src="iwp-chatbot.iife.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.IWPChatbot) {
        var widget = new window.IWPChatbot({
          apiUrl: 'https://iwp-chatbot-backend.onrender.com/api/v1',
          position: 'bottom-right'
        });
        widget.init();
      }
    });
  </script>
</body>
</html>
