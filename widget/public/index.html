<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IWP Chatbot Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 620px;
      width: 100%;
    }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    .badge {
      display: inline-block;
      background: #22c55e22;
      color: #22c55e;
      border: 1px solid #22c55e55;
      border-radius: 999px;
      font-size: 0.75rem;
      padding: 2px 10px;
      margin-bottom: 1.5rem;
    }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; color: #cbd5e1; }
    pre {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.25rem;
      overflow-x: auto;
      font-size: 0.82rem;
      line-height: 1.7;
      color: #7dd3fc;
    }
    .note {
      margin-top: 1.5rem;
      background: #172033;
      border-left: 3px solid #3b82f6;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>IWP Chatbot Widget</h1>
    <span class="badge">✓ Live</span>
    <p>
      This page hosts the embeddable chatbot widget script. Add the snippet below to any webpage to embed the IWP chatbot.
    </p>
    <h2>Embed Code</h2>
    <pre id="snippet"></pre>
    <div class="note">
      Replace <strong>YOUR_BACKEND_URL</strong> with your deployed backend API URL (e.g. your Render or Railway URL).
    </div>
  </div>

  <script>
    const origin = window.location.origin;
    const snippet = `&lt;script src="${origin}/iwp-chatbot.iife.js"&gt;&lt;/script&gt;
&lt;script&gt;
  const widget = new IWPChatbot({
    apiUrl: 'YOUR_BACKEND_URL/api/v1'
  });
  widget.init();
&lt;/script&gt;`;
    document.getElementById('snippet').innerHTML = snippet;
  </script>
</body>
</html>
